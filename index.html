<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>情緒氣象觀測站 · 全球情緒連結平台</title>
  <style>
    :root {
      --bg: #0f1a2e;
      --surface: #16253e;
      --card: #1e3550;
      --text: #e0e8f0;
      --text-soft: #8a9bb5;
      --accent: #ff7f50;
      --accent-glow: #ff9f70;
      --bottle: #c9e9d2;
      --bottle-dark: #7ab89a;
      --sand: #f5e6d3;
      --rainbow-1: #ff6b6b;
      --rainbow-2: #ffa94d;
      --rainbow-3: #ffd43b;
      --rainbow-4: #69db7c;
      --rainbow-5: #74c0fc;
      --border: #2a4060;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 24px rgba(255, 127, 80, 0.25);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang TC', 'Noto Sans TC', 'SF Pro Text', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(255,127,80,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 100%, rgba(116,192,252,0.06) 0%, transparent 50%);
    }
    .app-container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頁首 */
    .header {
      text-align: center;
      padding: 20px 0 8px;
    }
    .header-icon { font-size: 3.2rem; display: block; margin-bottom: 4px; }
    .header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.03em; }
    .subtitle { color: var(--text-soft); font-size: 0.85rem; margin-top: 2px; }
    .user-row {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
    }
    .user-badge {
      background: var(--accent); color: #fff; padding: 6px 16px; border-radius: 20px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: var(--transition);
    }
    .user-badge:hover { box-shadow: var(--shadow-glow); }
    .sync-status { font-size: 0.7rem; color: var(--text-soft); margin-top: 4px; min-height: 18px; }

    /* Tab 導航 */
    .tab-nav {
      display: flex; gap: 4px; background: var(--surface); border-radius: 40px; padding: 5px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 12px 10px; border: none; background: transparent; color: var(--text-soft);
      border-radius: 32px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
      transition: var(--transition); white-space: nowrap; letter-spacing: 0.02em;
    }
    .tab-btn.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-glow); }
    .tab-btn:hover:not(.active) { color: #c0d0e0; background: rgba(255,255,255,0.04); }

    /* 內容區 */
    .tab-content { display: none; flex-direction: column; gap: 18px; }
    .tab-content.active { display: flex; }
    .section-card {
      background: var(--surface); border-radius: var(--radius-xl); padding: 22px 24px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .section-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em;
      font-weight: 600; color: var(--text-soft); margin-bottom: 10px; display: block;
    }

    /* 情緒天氣選擇 (共通) */
    .mood-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .mood-option {
      flex: 1 1 60px; min-width: 60px; background: var(--card); border: 2px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 4px 10px; text-align: center; cursor: pointer;
      transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .mood-option:hover { border-color: #5a7a9a; transform: translateY(-2px); }
    .mood-option.selected { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,127,80,0.2); transform: translateY(-2px); }
    .mood-option .emoji { font-size: 1.8rem; }
    .mood-option .label { font-size: 0.78rem; color: var(--text-soft); }
    .mood-option.selected .label { color: var(--accent-glow); font-weight: 700; }

    /* 滑桿 */
    .intensity-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    input[type="range"] {
      flex: 1; height: 6px; -webkit-appearance: none;
      background: linear-gradient(to right, #3a6080, var(--accent), #ff4444); border-radius: 4px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px; background: #fff;
      border: 3px solid var(--accent); border-radius: 50%; box-shadow: 0 4px 14px rgba(0,0,0,0.3); cursor: pointer;
    }
    .intensity-badge { font-weight: 700; font-size: 1.1rem; min-width: 40px; text-align: center; }

    /* 輸入框 */
    textarea {
      width: 100%; border: 2px solid var(--border); border-radius: var(--radius-md); padding: 12px;
      font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 70px;
      background: var(--card); color: var(--text); transition: var(--transition);
    }
    textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 14px rgba(255,127,80,0.1); }
    .char-count { text-align: right; font-size: 0.65rem; color: var(--text-soft); }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 32px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: var(--transition); letter-spacing: 0.03em; margin-top: 10px;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 18px rgba(255,127,80,0.3); }
    .btn-primary:hover { background: #ff8f60; transform: translateY(-1px); }
    .btn-secondary { background: transparent; border: 2px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); background: rgba(255,127,80,0.05); }
    .validation-error { color: #ff6b6b; font-size: 0.75rem; margin-top: 6px; }

    /* 篩選工具列 */
    .toolbar {
      display: flex; gap: 6px; background: var(--surface); padding: 5px; border-radius: 32px;
      border: 1px solid var(--border);
    }
    .filter-btn, .sort-btn {
      padding: 8px 16px; border: none; background: transparent; color: var(--text-soft);
      border-radius: 24px; font-weight: 500; cursor: pointer; transition: var(--transition); font-size: 0.8rem;
    }
    .filter-btn.active { background: var(--accent); color: #fff; }
    .sort-btn { margin-left: auto; background: #2a4060; }

    /* 卡片列表 */
    .records-list { display: flex; flex-direction: column; gap: 12px; }
    .record-card {
      background: var(--card); border-radius: var(--radius-lg); padding: 16px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2); border: 1px solid var(--border);
      display: flex; gap: 14px; align-items: center; transition: var(--transition); position: relative;
    }
    .record-card.is-done { opacity: 0.55; border-color: #2a3040; }
    .mood-icon { font-size: 2.2rem; width: 48px; text-align: center; flex-shrink: 0; }
    .record-content { flex: 1; min-width: 0; }
    .record-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
    .record-diary { font-size: 0.88rem; color: #c8d8e8; word-break: break-word; }
    .record-time { font-size: 0.68rem; color: #6a8090; margin-top: 2px; }
    .record-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .icon-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-soft);
      font-size: 1rem; cursor: pointer; padding: 6px 10px; border-radius: 20px; transition: var(--transition);
    }
    .icon-btn:hover { background: rgba(255,127,80,0.12); border-color: var(--accent); color: #fff; }
    .public-badge {
      font-size: 0.65rem; padding: 3px 10px; border-radius: 12px; background: rgba(255,127,80,0.2); color: var(--accent-glow);
      margin-left: 6px;
    }
    .empty-message { text-align: center; padding: 40px; color: var(--text-soft); }

    /* 漂流瓶卡片 */
    .bottle-card {
      background: linear-gradient(135deg, #1a3a4a, #0d2838); border-radius: 60px 60px 30px 30px;
      padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); border: 2px solid #3a6070;
      text-align: center; position: relative; max-width: 360px; margin: 0 auto; width: 100%;
    }
    .bottle-card .bottle-neck {
      width: 50px; height: 22px; background: #3a6070; border-radius: 10px 10px 0 0; margin: -10px auto 10px;
    }
    .bottle-card .bottle-emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; }
    .bottle-card .bottle-mood { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .bottle-card .bottle-diary { font-size: 0.95rem; color: #c8d8e8; margin-bottom: 10px; font-style: italic; }
    .bottle-card .bottle-region { font-size: 0.7rem; color: #6a8090; }
    .cheer-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .cheer-btn {
      background: rgba(255,255,255,0.06); border: 2px solid var(--border); color: #fff;
      font-size: 1.2rem; padding: 10px 16px; border-radius: 28px; cursor: pointer; transition: var(--transition);
    }
    .cheer-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-glow); transform: scale(1.05); }
    .cheer-btn.sent { background: var(--accent); border-color: var(--accent); animation: pulse 0.6s ease; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }

    /* 世界地圖 */
    .world-map { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .continent-card {
      background: var(--card); border-radius: var(--radius-lg); padding: 16px;
      border: 1px solid var(--border); text-align: center; cursor: pointer; transition: var(--transition);
      min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .continent-card:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,127,80,0.15); }
    .continent-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
    .continent-emojis { font-size: 1.6rem; letter-spacing: 2px; line-height: 1.6; }
    .continent-count { font-size: 0.65rem; color: var(--text-soft); margin-top: 4px; }

    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; text-align: center; }

    @media (max-width: 500px) {
      .tab-btn { font-size: 0.75rem; padding: 10px 6px; }
      .record-card { flex-wrap: wrap; }
      .world-map { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="header">
    <span class="header-icon">🌤️</span>
    <h1>情緒氣象觀測站</h1>
    <p class="subtitle">把你的心情投向世界，撈起陌生人的溫暖</p>
    <div class="user-row">
      <span class="user-badge" id="userBadge">🙂 匿名旅人</span>
    </div>
    <p class="sync-status" id="syncStatus">🟡 正在連接雲端...</p>
  </header>

  <!-- Tab 導航 -->
  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="tab-diary">📔 我的日記</button>
    <button class="tab-btn" data-tab="tab-bottle">🫧 漂流瓶</button>
    <button class="tab-btn" data-tab="tab-world">🌍 世界情緒</button>
  </nav>

  <!-- Tab 1: 個人日記 -->
  <div class="tab-content active" id="tab-diary">
    <div class="section-card">
      <form id="diaryForm" autocomplete="off">
        <span class="section-label">🌡️ 情緒天氣</span>
        <div class="mood-grid" id="diaryMoodGrid"></div>
        <input type="hidden" id="diarySelectedMood" value="">
        <span class="section-label">💪 強度</span>
        <div class="intensity-row">
          <input type="range" id="diaryIntensity" min="1" max="10" value="5" step="1">
          <span class="intensity-badge" id="diaryIntensityDisplay">5</span>
        </div>
        <span class="section-label">📝 一句話日記</span>
        <textarea id="diaryText" maxlength="100" placeholder="寫下此刻的感受..."></textarea>
        <div class="char-count" id="diaryCharCount">0 / 100</div>
        <div class="validation-error" id="diaryError"></div>
        <button type="submit" class="btn btn-primary">📡 記錄情緒</button>
        <input type="hidden" id="diaryEditingId" value="">
      </form>
    </div>
    <div class="toolbar" id="diaryToolbar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">活躍中</button>
      <button class="filter-btn" data-filter="done">已回顧</button>
      <button class="sort-btn" id="diarySortBtn">🕒 最新 ⇄ 最舊</button>
    </div>
    <div id="diaryList" class="records-list"></div>
  </div>

  <!-- Tab 2: 漂流瓶 -->
  <div class="tab-content" id="tab-bottle">
    <div class="section-card" style="text-align:center;">
      <span class="section-title">🫧 把你的心情裝進瓶子，投向大海</span>
      <form id="bottleForm" autocomplete="off">
        <span class="section-label">🌡️ 情緒天氣</span>
        <div class="mood-grid" id="bottleMoodGrid"></div>
        <input type="hidden" id="bottleSelectedMood" value="">
        <span class="section-label">💪 強度</span>
        <div class="intensity-row">
          <input type="range" id="bottleIntensity" min="1" max="10" value="5" step="1">
          <span class="intensity-badge" id="bottleIntensityDisplay">5</span>
        </div>
        <span class="section-label">📝 瓶中信</span>
        <textarea id="bottleDiary" maxlength="100" placeholder="寫下想對世界說的話..."></textarea>
        <div class="char-count" id="bottleCharCount">0 / 100</div>
        <span class="section-label">🌍 你的地區</span>
        <select id="bottleRegion" style="width:100%;padding:10px;border-radius:12px;background:var(--card);color:var(--text);border:2px solid var(--border);margin-bottom:10px;">
          <option value="asia">亞洲</option>
          <option value="europe">歐洲</option>
          <option value="north_america">北美洲</option>
          <option value="south_america">南美洲</option>
          <option value="africa">非洲</option>
          <option value="oceania">大洋洲</option>
        </select>
        <div class="validation-error" id="bottleError"></div>
        <button type="submit" class="btn btn-primary">🫧 投向大海</button>
      </form>
    </div>
    <div class="section-card" style="text-align:center;">
      <span class="section-title">🐚 撈取一個陌生人的瓶子</span>
      <div id="bottleDisplay">
        <p style="color:var(--text-soft);">點擊下方按鈕，隨機撈取一個來自世界的情緒瓶子</p>
      </div>
      <button class="btn btn-primary" id="fetchBottleBtn">🎣 撈取瓶子</button>
    </div>
  </div>

  <!-- Tab 3: 世界情緒地圖 -->
  <div class="tab-content" id="tab-world">
    <div class="section-card">
      <span class="section-title">🌍 世界情緒氣象</span>
      <p style="text-align:center;color:var(--text-soft);font-size:0.8rem;margin-bottom:14px;">點擊各大洲查看最新情緒</p>
      <div class="world-map" id="worldMap"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfKod0AKQVH_BAcrhSICqSf1cZy_SIdQeJwFLkDN8yLGaPtqvZaP_8CP4G7bQCG3scwQ/exec";
  const STORAGE_KEY = 'records';
  const USER_KEY = 'moodUser';
  const MOODS = {
    sunny: { label: '晴', emoji: '☀️' },
    cloudy: { label: '陰', emoji: '☁️' },
    rainy: { label: '雨', emoji: '🌧️' },
    thunder: { label: '雷', emoji: '⛈️' },
    rainbow: { label: '彩虹', emoji: '🌈' }
  };
  const VALID_MOODS = Object.keys(MOODS);
  const REGION_LABELS = {
    asia: '亞洲', europe: '歐洲', north_america: '北美洲',
    south_america: '南美洲', africa: '非洲', oceania: '大洋洲'
  };
  const REGION_EMOJIS = {
    asia: '🌏', europe: '🌍', north_america: '🌎',
    south_america: '🌎', africa: '🌍', oceania: '🏝️'
  };

  let records = [];
  let currentUser = null;
  let currentTab = 'tab-diary';
  let diaryFilter = 'all';
  let diarySortAsc = false;
  let diarySelectedMood = '';
  let diaryEditingId = null;
  let bottleSelectedMood = '';
  let cloudAvailable = false;

  // DOM refs
  const syncStatusEl = document.getElementById('syncStatus');
  const userBadge = document.getElementById('userBadge');
  const tabNav = document.getElementById('tabNav');
  const tabContents = document.querySelectorAll('.tab-content');

  // Tab 1 refs
  const diaryForm = document.getElementById('diaryForm');
  const diaryMoodGrid = document.getElementById('diaryMoodGrid');
  const diarySelectedMoodInput = document.getElementById('diarySelectedMood');
  const diaryIntensity = document.getElementById('diaryIntensity');
  const diaryIntensityDisplay = document.getElementById('diaryIntensityDisplay');
  const diaryText = document.getElementById('diaryText');
  const diaryCharCount = document.getElementById('diaryCharCount');
  const diaryError = document.getElementById('diaryError');
  const diaryEditingIdInput = document.getElementById('diaryEditingId');
  const diaryList = document.getElementById('diaryList');
  const diaryToolbar = document.getElementById('diaryToolbar');
  const diarySortBtn = document.getElementById('diarySortBtn');

  // Tab 2 refs
  const bottleForm = document.getElementById('bottleForm');
  const bottleMoodGrid = document.getElementById('bottleMoodGrid');
  const bottleSelectedMoodInput = document.getElementById('bottleSelectedMood');
  const bottleIntensity = document.getElementById('bottleIntensity');
  const bottleIntensityDisplay = document.getElementById('bottleIntensityDisplay');
  const bottleDiary = document.getElementById('bottleDiary');
  const bottleCharCount = document.getElementById('bottleCharCount');
  const bottleRegion = document.getElementById('bottleRegion');
  const bottleError = document.getElementById('bottleError');
  const bottleDisplay = document.getElementById('bottleDisplay');
  const fetchBottleBtn = document.getElementById('fetchBottleBtn');

  // Tab 3 refs
  const worldMap = document.getElementById('worldMap');

  // ========== 核心函式 ==========
  function createRecord(data) {
    if (!data.mood || !VALID_MOODS.includes(data.mood)) throw new Error('請選擇情緒天氣');
    if (typeof data.intensity !== 'number' || data.intensity < 1 || data.intensity > 10) throw new Error('強度1-10');
    return {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36),
      createdAt: new Date().toISOString(),
      status: data.status || 'active',
      userId: currentUser.id,
      mood: data.mood,
      intensity: data.intensity,
      diary: (data.diary || '').trim().slice(0,100),
      isPublic: data.isPublic !== undefined ? data.isPublic : false,
      region: data.region || '',
      cheers: data.cheers || '[]'
    };
  }

  function saveData(record) {
    records.push(record);
    persistLocal();
    syncToSheet({ action: "create", record });
  }

  function updateRecord(id, changes) {
    const idx = records.findIndex(r => r.id === id);
    if (idx === -1) return false;
    records[idx] = { ...records[idx], ...changes };
    persistLocal();
    syncToSheet({ action: "update", id, changes });
    return true;
  }

  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    persistLocal();
    syncToSheet({ action: "delete", id });
  }

  function loadData() {
    const local = loadFromLocal();
    records = local;
    fetchFromSheet().then(sheetRecords => {
      if (sheetRecords !== null) {
        records = sheetRecords;
        cloudAvailable = true;
        syncStatusEl.textContent = '🟢 雲端已同步';
        persistLocal();
      } else {
        cloudAvailable = false;
        syncStatusEl.textContent = '🟠 無法連接雲端，使用離線資料';
      }
      refreshAll();
    }).catch(() => {
      cloudAvailable = false;
      syncStatusEl.textContent = '🔴 雲端離線，使用本地資料';
      refreshAll();
    });
  }

  // ========== Google Sheet 同步 ==========
  function syncToSheet(payload) {
    if (!APPS_SCRIPT_URL) return;
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).then(r => r.json()).then(d => {
      if (!d.ok) console.warn('Sheet sync error:', d.error);
    }).catch(e => console.warn('Sheet unreachable:', e.message));
  }

  async function fetchFromSheet() {
    if (!APPS_SCRIPT_URL) return null;
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      if (data.ok && Array.isArray(data.records)) return data.records.map(normalizeRecord);
      return null;
    } catch { return null; }
  }

  function normalizeRecord(r) {
    return {
      id: r.id || r.ID || '',
      createdAt: r.createdAt || r.CreatedAt || new Date().toISOString(),
      status: r.status || r.Status || 'active',
      userId: r.userId || r.UserID || '',
      mood: r.mood || r.Mood || 'sunny',
      intensity: Number(r.intensity || r.Intensity || 0),
      diary: r.diary || r.Diary || '',
      isPublic: r.isPublic === 'true' || r.isPublic === true || r.isPublic === 'TRUE',
      region: r.region || r.Region || '',
      cheers: r.cheers || r.Cheers || '[]'
    };
  }

  // ========== localStorage ==========
  function loadFromLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw).filter(r => r && r.id) : [];
    } catch { return []; }
  }
  function persistLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

  // ========== 使用者 ==========
  function loadUser() {
    const raw = localStorage.getItem(USER_KEY);
    if (raw) { currentUser = JSON.parse(raw); return; }
    currentUser = { id: crypto.randomUUID(), name: '匿名旅人', emoji: '🙂' };
    saveUser();
  }
  function saveUser() { localStorage.setItem(USER_KEY, JSON.stringify(currentUser)); }
  userBadge.addEventListener('click', () => {
    const name = prompt('輸入你的匿名暱稱：', currentUser.name) || currentUser.name;
    const emoji = prompt('選擇代表表情：', currentUser.emoji) || currentUser.emoji;
    currentUser = { ...currentUser, name, emoji };
    saveUser();
    userBadge.textContent = `${currentUser.emoji} ${currentUser.name}`;
  });

  // ========== 輔助 ==========
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function formatTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? iso : `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function buildMoodGrid(container, onSelect) {
    container.innerHTML = Object.entries(MOODS).map(([k,v]) => `
      <div class="mood-option" data-mood="${k}"><span class="emoji">${v.emoji}</span><span class="label">${v.label}</span></div>
    `).join('');
    container.querySelectorAll('.mood-option').forEach(opt => {
      opt.addEventListener('click', () => {
        container.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        onSelect(opt.dataset.mood);
      });
    });
  }

  // ========== 渲染 ==========
  function renderDiaryList(filtered) {
    const sorted = [...filtered].sort((a,b) => {
      return diarySortAsc ? new Date(a.createdAt)-new Date(b.createdAt) : new Date(b.createdAt)-new Date(a.createdAt);
    });
    if (!sorted.length) { diaryList.innerHTML = '<div class="empty-message">📭 尚無日記</div>'; return; }
    diaryList.innerHTML = sorted.map(r => {
      const mood = MOODS[r.mood] || {};
      const doneClass = r.status === 'done' ? 'is-done' : '';
      return `<div class="record-card ${doneClass}">
        <div class="mood-icon">${mood.emoji||'❓'}</div>
        <div class="record-content">
          <div class="record-meta"><span>${mood.label} · ${r.intensity}/10</span>${r.isPublic?'<span class="public-badge">🌐 公開</span>':''}</div>
          <div class="record-diary">${escapeHtml(r.diary)||'⋯'}</div>
          <div class="record-time">${formatTime(r.createdAt)}</div>
        </div>
        <div class="record-actions">
          <button class="icon-btn toggle-done" data-id="${r.id}">${r.status==='done'?'↩️':'✅'}</button>
          <button class="icon-btn edit-diary" data-id="${r.id}">✏️</button>
          <button class="icon-btn delete-diary" data-id="${r.id}">🗑️</button>
        </div>
      </div>`;
    }).join('');
    bindDiaryButtons();
  }

  function bindDiaryButtons() {
    diaryList.querySelectorAll('.toggle-done').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.dataset.id;
      const r = records.find(x => x.id === id);
      if (r) updateRecord(id, { status: r.status === 'active' ? 'done' : 'active' });
      refreshDiary();
    }));
    diaryList.querySelectorAll('.edit-diary').forEach(b => b.addEventListener('click', e => startEditDiary(e.currentTarget.dataset.id)));
    diaryList.querySelectorAll('.delete-diary').forEach(b => b.addEventListener('click', e => {
      if (confirm('確定刪除？')) { deleteRecord(e.currentTarget.dataset.id); refreshDiary(); }
    }));
  }

  function renderBottleDisplay(record) {
    if (!record) {
      bottleDisplay.innerHTML = '<p style="color:var(--text-soft);">點擊下方按鈕，隨機撈取一個來自世界的情緒瓶子</p>';
      return;
    }
    const mood = MOODS[record.mood] || {};
    const regionName = REGION_LABELS[record.region] || '未知';
    let cheersArr = [];
    try { cheersArr = JSON.parse(record.cheers || '[]'); } catch { cheersArr = []; }
    bottleDisplay.innerHTML = `
      <div class="bottle-card">
        <div class="bottle-neck"></div>
        <span class="bottle-emoji">${mood.emoji}</span>
        <div class="bottle-mood">${mood.label} · ${record.intensity}/10</div>
        <div class="bottle-diary">"${escapeHtml(record.diary) || '⋯'}"</div>
        <div class="bottle-region">📍 ${regionName} · ${formatTime(record.createdAt)}</div>
        <div class="cheer-buttons" id="cheerButtons">
          <button class="cheer-btn" data-cheer="🫶">🫶 暖心拍拍</button>
          <button class="cheer-btn" data-cheer="🌈">🌈 送你彩虹</button>
          <button class="cheer-btn" data-cheer="🔥">🔥 我懂</button>
        </div>
      </div>`;
    bottleDisplay.querySelectorAll('.cheer-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const cheer = this.dataset.cheer;
        let arr = [];
        try { arr = JSON.parse(record.cheers || '[]'); } catch { arr = []; }
        arr.push(cheer);
        updateRecord(record.id, { cheers: JSON.stringify(arr) });
        this.classList.add('sent');
        setTimeout(() => this.classList.remove('sent'), 600);
      });
    });
  }

  function renderWorldMap() {
    const continents = ['asia', 'europe', 'north_america', 'south_america', 'africa', 'oceania'];
    worldMap.innerHTML = continents.map(c => {
      const regionRecords = records.filter(r => r.region === c && r.isPublic);
      const moodCounts = {};
      regionRecords.forEach(r => { moodCounts[r.mood] = (moodCounts[r.mood]||0)+1; });
      const topEmojis = Object.entries(moodCounts).sort((a,b)=>b[1]-a[1]).slice(0,8)
        .map(([m]) => MOODS[m]?.emoji || '').join(' ');
      return `<div class="continent-card" data-region="${c}">
        <span style="font-size:1.8rem;">${REGION_EMOJIS[c]}</span>
        <span class="continent-name">${REGION_LABELS[c]}</span>
        <span class="continent-emojis">${topEmojis || '⋯'}</span>
        <span class="continent-count">${regionRecords.length} 個瓶子</span>
      </div>`;
    }).join('');
  }

  function refreshDiary() {
    const filtered = diaryFilter === 'all' ? records.filter(r => !r.isPublic || r.userId === currentUser.id)
      : records.filter(r => r.status === diaryFilter && (!r.isPublic || r.userId === currentUser.id));
    renderDiaryList(filtered);
  }
  function refreshAll() {
    refreshDiary();
    renderWorldMap();
    userBadge.textContent = `${currentUser.emoji} ${currentUser.name}`;
  }

  function startEditDiary(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    diarySelectedMood = r.mood; diarySelectedMoodInput.value = r.mood;
    document.querySelectorAll('#diaryMoodGrid .mood-option').forEach(o => o.classList.toggle('selected', o.dataset.mood === r.mood));
    diaryIntensity.value = r.intensity; diaryIntensityDisplay.textContent = r.intensity;
    diaryText.value = r.diary; diaryCharCount.textContent = `${r.diary.length}/100`;
    diaryEditingIdInput.value = r.id; diaryEditingId = r.id;
    diaryError.textContent = '';
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function resetDiaryForm() {
    diarySelectedMood = ''; diarySelectedMoodInput.value = '';
    document.querySelectorAll('#diaryMoodGrid .mood-option').forEach(o => o.classList.remove('selected'));
    diaryIntensity.value = 5; diaryIntensityDisplay.textContent = '5';
    diaryText.value = ''; diaryCharCount.textContent = '0/100';
    diaryEditingIdInput.value = ''; diaryEditingId = null;
    diaryError.textContent = '';
  }
  function resetBottleForm() {
    bottleSelectedMood = ''; bottleSelectedMoodInput.value = '';
    document.querySelectorAll('#bottleMoodGrid .mood-option').forEach(o => o.classList.remove('selected'));
    bottleIntensity.value = 5; bottleIntensityDisplay.textContent = '5';
    bottleDiary.value = ''; bottleCharCount.textContent = '0/100';
    bottleError.textContent = '';
  }

  // ========== Tab 切換 ==========
  tabNav.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      tabNav.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      tabContents.forEach(tc => tc.classList.remove('active'));
      document.getElementById(currentTab).classList.add('active');
      if (currentTab === 'tab-world') renderWorldMap();
    });
  });

  // ========== 事件綁定 ==========
  // Tab 1
  buildMoodGrid(diaryMoodGrid, (mood) => { diarySelectedMood = mood; diarySelectedMoodInput.value = mood; });
  diaryIntensity.addEventListener('input', e => { diaryIntensityDisplay.textContent = e.target.value; });
  diaryText.addEventListener('input', e => { diaryCharCount.textContent = `${e.target.value.length}/100`; });
  diaryForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!diarySelectedMood) { diaryError.textContent = '請選擇天氣'; return; }
    const intensity = parseInt(diaryIntensity.value);
    if (isNaN(intensity) || intensity<1||intensity>10) { diaryError.textContent='強度錯誤'; return; }
    const record = createRecord({ mood: diarySelectedMood, intensity, diary: diaryText.value.trim(), status: 'active', isPublic: false });
    if (diaryEditingId) {
      updateRecord(diaryEditingId, { mood: diarySelectedMood, intensity, diary: diaryText.value.trim() });
    } else {
      saveData(record);
    }
    resetDiaryForm();
    refreshDiary();
  });
  diaryToolbar.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() {
    diaryToolbar.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    diaryFilter = this.dataset.filter;
    refreshDiary();
  }));
  diarySortBtn.addEventListener('click', () => {
    diarySortAsc = !diarySortAsc;
    diarySortBtn.textContent = diarySortAsc ? '🕒 最舊 ⇄ 最新' : '🕒 最新 ⇄ 最舊';
    refreshDiary();
  });

  // Tab 2
  buildMoodGrid(bottleMoodGrid, (mood) => { bottleSelectedMood = mood; bottleSelectedMoodInput.value = mood; });
  bottleIntensity.addEventListener('input', e => { bottleIntensityDisplay.textContent = e.target.value; });
  bottleDiary.addEventListener('input', e => { bottleCharCount.textContent = `${e.target.value.length}/100`; });
  bottleForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!bottleSelectedMood) { bottleError.textContent = '請選擇天氣'; return; }
    const intensity = parseInt(bottleIntensity.value);
    if (isNaN(intensity) || intensity<1||intensity>10) { bottleError.textContent='強度錯誤'; return; }
    const record = createRecord({
      mood: bottleSelectedMood, intensity, diary: bottleDiary.value.trim(),
      status: 'active', isPublic: true, region: bottleRegion.value
    });
    saveData(record);
    resetBottleForm();
    bottleDisplay.innerHTML = '<p style="color:#69db7c;">✅ 你的瓶子已投向大海！</p>';
    refreshAll();
  });
  fetchBottleBtn.addEventListener('click', () => {
    const publicRecords = records.filter(r => r.isPublic && r.userId !== currentUser.id);
    if (!publicRecords.length) {
      bottleDisplay.innerHTML = '<p style="color:var(--text-soft);">🌊 大海中還沒有其他瓶子，快投遞一個吧！</p>';
      return;
    }
    const random = publicRecords[Math.floor(Math.random() * publicRecords.length)];
    renderBottleDisplay(random);
  });

  // ========== 初始化 ==========
  function init() {
    loadUser();
    buildMoodGrid(diaryMoodGrid, (mood) => { diarySelectedMood = mood; diarySelectedMoodInput.value = mood; });
    buildMoodGrid(bottleMoodGrid, (mood) => { bottleSelectedMood = mood; bottleSelectedMoodInput.value = mood; });
    const local = loadFromLocal();
    records = local;
    refreshAll();
    fetchFromSheet().then(sheetRecords => {
      if (sheetRecords !== null) {
        records = sheetRecords;
        cloudAvailable = true;
        syncStatusEl.textContent = '🟢 雲端已同步';
        persistLocal();
      } else {
        cloudAvailable = false;
        syncStatusEl.textContent = '🟠 無法連接雲端，使用離線資料';
      }
      refreshAll();
    }).catch(() => {
      cloudAvailable = false;
      syncStatusEl.textContent = '🔴 雲端離線，使用本地資料';
    });
  }
  init();
})();
</script>
</body>
</html>
