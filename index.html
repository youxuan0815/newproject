<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>情緒氣象觀測站 · 多人互動版</title>
  <style>
    :root {
      --bg: #f7f4f0;
      --surface: #ffffff;
      --text: #2e2a28;
      --text-soft: #6b635e;
      --border: #e0d9d2;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.06);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --transition: 0.2s ease;
      --sunny: #f5a623;
      --sunny-bg: #fef7ed;
      --cloudy: #8e8e93;
      --cloudy-bg: #f4f4f6;
      --rainy: #4a90d9;
      --rainy-bg: #eef4fb;
      --thunder: #7b5ea7;
      --thunder-bg: #f4f0f8;
      --rainbow: #e57373;
      --rainbow-bg: #fef2f2;
      --done-mask: rgba(255, 255, 255, 0.5);
      --accent: #4a3f3a;
      --accent-light: #f0ebe4;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'PingFang TC', 'Noto Sans TC', 'SF Pro Text', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .header {
      text-align: center;
      padding: 16px 0 8px;
    }
    .header-icon {
      font-size: 3.8rem;
      display: block;
      margin-bottom: 6px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.08));
    }
    .header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #3e342e;
    }
    .subtitle {
      color: var(--text-soft);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .sync-status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-soft);
      margin-top: 2px;
      min-height: 18px;
    }
    .user-bar {
      background: var(--surface);
      border-radius: 60px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .user-avatars {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 40px;
      background: #f3efe9;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      white-space: nowrap;
    }
    .user-chip.active {
      background: #4a3f3a;
      color: white;
      border-color: #4a3f3a;
      box-shadow: 0 4px 10px rgba(74,63,58,0.2);
    }
    .user-chip .emoji {
      font-size: 1.2rem;
    }
    .add-user-btn {
      background: white;
      border: 2px dashed #c9c0b6;
      border-radius: 40px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      transition: var(--transition);
      color: #8b8178;
      margin-left: 4px;
    }
    .add-user-btn:hover {
      border-color: #4a3f3a;
      color: #4a3f3a;
      background: #faf8f5;
    }
    .form-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 24px 26px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      color: var(--text-soft);
      margin-bottom: 12px;
      display: block;
    }
    .mood-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .mood-option {
      flex: 1 1 70px;
      min-width: 70px;
      background: #faf8f5;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 6px 12px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .mood-option.selected {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
    }
    .mood-option .emoji {
      font-size: 2rem;
    }
    .mood-option .label {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .mood-option[data-mood="sunny"].selected { border-color: var(--sunny); background: var(--sunny-bg); }
    .mood-option[data-mood="cloudy"].selected { border-color: var(--cloudy); background: var(--cloudy-bg); }
    .mood-option[data-mood="rainy"].selected { border-color: var(--rainy); background: var(--rainy-bg); }
    .mood-option[data-mood="thunder"].selected { border-color: var(--thunder); background: var(--thunder-bg); }
    .mood-option[data-mood="rainbow"].selected { border-color: var(--rainbow); background: var(--rainbow-bg); }
    .intensity-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: linear-gradient(to right, #d9cfc4, #f5a623, #c0392b);
      border-radius: 4px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      background: white;
      border: 3px solid #5b7a9a;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .intensity-badge {
      font-weight: 700;
      font-size: 1.2rem;
      min-width: 44px;
      text-align: center;
    }
    textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 75px;
      background: #fcfbf9;
      transition: var(--transition);
    }
    textarea:focus {
      border-color: #b1a79e;
      outline: none;
      background: white;
    }
    .char-count {
      text-align: right;
      font-size: 0.7rem;
      color: var(--text-soft);
    }
    .submit-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: #4a3f3a;
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.04em;
    }
    .submit-btn:hover { background: #5f524a; }
    .validation-error {
      color: #c0392b;
      font-size: 0.8rem;
      margin-top: 6px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 6px;
      border-radius: 50px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .filter-btn, .sort-btn {
      padding: 10px 18px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.85rem;
    }
    .filter-btn.active { background: #4a3f3a; color: white; }
    .sort-btn { margin-left: auto; background: #f3efe9; }
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .record-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: center;
      transition: var(--transition);
      position: relative;
    }
    .record-card.is-done {
      background: #f9f7f5;
      border-color: #e7e0d8;
    }
    .record-card.is-done .mood-icon {
      opacity: 0.6;
    }
    .mood-icon {
      font-size: 2.4rem;
      width: 52px;
      text-align: center;
    }
    .record-content {
      flex: 1;
    }
    .record-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .record-user {
      background: #f0ebe4;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .record-diary {
      font-size: 0.92rem;
      color: #4a3f3a;
    }
    .record-time {
      font-size: 0.7rem;
      color: #a79e96;
    }
    .record-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 14px;
      background: #e8f5e9;
      color: #2e6b3a;
    }
    .status-badge.done { background: #f0edf5; color: #5e4b7a; }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .icon-btn:hover { background: #eee; }
    .empty-message {
      text-align: center;
      padding: 48px;
      color: var(--text-soft);
    }
    @media (max-width: 500px) {
      .record-card { flex-wrap: wrap; }
      .record-actions { flex-direction: row; width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="header">
    <span class="header-icon">🌤️</span>
    <h1>情緒氣象觀測站</h1>
    <p class="subtitle">多人共感 · 記錄每個人的內心天氣</p>
    <p class="sync-status" id="syncStatus">🟡 正在連接雲端...</p>
  </header>

  <div class="user-bar" id="userBar">
    <div class="user-avatars" id="userList"></div>
    <button class="add-user-btn" id="addUserBtn" title="新增使用者">+</button>
  </div>

  <div class="form-card">
    <form id="recordForm" autocomplete="off">
      <span class="section-label">🌡️ 情緒天氣</span>
      <div class="mood-grid" id="moodGrid"></div>
      <input type="hidden" id="selectedMood" value="">

      <span class="section-label">💪 強度</span>
      <div class="intensity-row">
        <input type="range" id="intensityRange" min="1" max="10" value="5" step="1">
        <span class="intensity-badge" id="intensityDisplay">5</span>
      </div>

      <span class="section-label">📝 一句話日記</span>
      <textarea id="diaryInput" maxlength="100" placeholder="寫下此刻的感受..."></textarea>
      <div class="char-count" id="charCount">0 / 100</div>
      <div class="validation-error" id="validationError"></div>
      <button type="submit" class="submit-btn">📡 記錄情緒</button>
      <input type="hidden" id="editingId" value="">
    </form>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="active">活躍中</button>
    <button class="filter-btn" data-filter="done">已回顧</button>
    <button class="sort-btn" id="sortBtn">🕒 最新 ⇄ 最舊</button>
  </div>

  <div id="recordsList" class="records-list"></div>
</div>

<script>
  (() => {
    // ========== 常數 ==========
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfKod0AKQVH_BAcrhSICqSf1cZy_SIdQeJwFLkDN8yLGaPtqvZaP_8CP4G7bQCG3scwQ/exec";
    const STORAGE_KEY = 'records';
    const USERS_KEY = 'moodUsers';
    const MOODS = {
      sunny: { label: '晴', emoji: '☀️' },
      cloudy: { label: '陰', emoji: '☁️' },
      rainy: { label: '雨', emoji: '🌧️' },
      thunder: { label: '雷', emoji: '⛈️' },
      rainbow: { label: '彩虹', emoji: '🌈' }
    };
    const VALID_MOODS = Object.keys(MOODS);

    // 狀態
    let records = [];
    let users = [];
    let currentUserId = null;
    let currentFilter = 'all';
    let sortAsc = false;
    let selectedMood = '';
    let editingId = null;
    let cloudAvailable = false;

    // DOM
    const syncStatusEl = document.getElementById('syncStatus');
    const userListEl = document.getElementById('userList');
    const addUserBtn = document.getElementById('addUserBtn');
    const moodGrid = document.getElementById('moodGrid');
    const selectedMoodInput = document.getElementById('selectedMood');
    const intensityRange = document.getElementById('intensityRange');
    const intensityDisplay = document.getElementById('intensityDisplay');
    const diaryInput = document.getElementById('diaryInput');
    const charCount = document.getElementById('charCount');
    const validationError = document.getElementById('validationError');
    const editingIdInput = document.getElementById('editingId');
    const recordsListEl = document.getElementById('recordsList');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const sortBtn = document.getElementById('sortBtn');
    const form = document.getElementById('recordForm');

    // ========== 核心函式 ==========
    function createRecord(formData) {
      if (!formData.mood || !VALID_MOODS.includes(formData.mood)) throw new Error('請選擇情緒天氣');
      if (typeof formData.intensity !== 'number' || formData.intensity < 1 || formData.intensity > 10) throw new Error('強度1-10');
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36),
        createdAt: new Date().toISOString(),
        status: 'active',
        userId: currentUserId,
        mood: formData.mood,
        intensity: formData.intensity,
        diary: (formData.diary || '').trim().slice(0,100)
      };
    }

    function saveData(record) {
      records.push(record);
      persistToLocalStorage();
      syncToSheet({ action: "create", record: record });
    }

    function loadData() {
      // 先從 localStorage 載入作為立即顯示的資料
      const localRecords = loadFromLocalStorage();
      records = localRecords;
      // 非同步從雲端拉取最新資料
      fetchRecordsFromSheet().then(sheetRecords => {
        if (sheetRecords !== null) {
          records = sheetRecords;
          cloudAvailable = true;
          syncStatusEl.textContent = '🟢 雲端已同步';
          persistToLocalStorage(); // 更新 localStorage
        } else {
          cloudAvailable = false;
          syncStatusEl.textContent = '🟠 無法連接雲端，使用離線資料';
        }
        refreshView();
      }).catch(() => {
        cloudAvailable = false;
        syncStatusEl.textContent = '🔴 雲端離線，使用本地資料';
        refreshView();
      });
      return records;
    }

    function updateRecord(id, changes) {
      const index = records.findIndex(r => r.id === id);
      if (index === -1) return false;
      records[index] = { ...records[index], ...changes };
      persistToLocalStorage();
      syncToSheet({ action: "update", id: id, changes: changes });
      return true;
    }

    function renderList(recordsToShow) {
      const sorted = [...recordsToShow].sort((a,b) => {
        const da = new Date(a.createdAt), db = new Date(b.createdAt);
        return sortAsc ? da - db : db - da;
      });
      if (!sorted.length) {
        recordsListEl.innerHTML = `<div class="empty-message">📭 尚無紀錄</div>`;
        return;
      }
      recordsListEl.innerHTML = sorted.map(r => {
        const user = users.find(u => u.id === r.userId) || { name: '匿名', emoji: '👤' };
        const mood = MOODS[r.mood] || {};
        const doneClass = r.status === 'done' ? 'is-done' : '';
        return `<div class="record-card ${doneClass}" data-id="${r.id}">
          <div class="mood-icon">${mood.emoji || '❓'}</div>
          <div class="record-content">
            <div class="record-meta">
              <span class="record-user">${user.emoji} ${user.name}</span>
              <span>${mood.label} · ${r.intensity}/10</span>
            </div>
            <div class="record-diary">${escapeHtml(r.diary) || '⋯'}</div>
            <div class="record-time">${formatTime(r.createdAt)}</div>
          </div>
          <div class="record-actions">
            <span class="status-badge ${r.status === 'done' ? 'done' : ''}">${r.status==='done'?'已回顧':'活躍'}</span>
            <div style="display:flex;gap:6px;">
              <button class="icon-btn toggle-status" data-id="${r.id}">${r.status==='done'?'↩️':'✅'}</button>
              <button class="icon-btn edit-record" data-id="${r.id}">✏️</button>
              <button class="icon-btn delete-record" data-id="${r.id}">🗑️</button>
            </div>
          </div>
        </div>`;
      }).join('');

      document.querySelectorAll('.toggle-status').forEach(b => b.addEventListener('click', (e) => {
        const id = e.currentTarget.dataset.id;
        const rec = records.find(r=>r.id===id);
        if(rec) updateRecord(id, {status: rec.status==='active'?'done':'active'});
        refreshView();
      }));
      document.querySelectorAll('.edit-record').forEach(b => b.addEventListener('click', (e) => {
        startEdit(e.currentTarget.dataset.id);
      }));
      document.querySelectorAll('.delete-record').forEach(b => b.addEventListener('click', (e) => {
        if(confirm('確定刪除這筆紀錄嗎？')) {
          records = records.filter(r => r.id !== e.currentTarget.dataset.id);
          persistToLocalStorage();
          refreshView();
        }
      }));
    }

    // ========== Google Sheet 同步函式 ==========

    function syncToSheet(payload) {
      if (!APPS_SCRIPT_URL) return;
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          console.log('📡 已同步到 Google Sheet:', payload.action);
        } else {
          console.warn('⚠️ Sheet 同步失敗:', data.error);
        }
      })
      .catch(err => {
        console.warn('⚠️ 無法連接 Google Sheet，資料僅存在 localStorage:', err.message);
      });
    }

    async function fetchRecordsFromSheet() {
      if (!APPS_SCRIPT_URL) return null;
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        if (data.ok && Array.isArray(data.records)) {
          return data.records.map(normalizeRecord);
        }
        return null;
      } catch (err) {
        console.warn('⚠️ 無法從 Google Sheet 讀取資料:', err.message);
        return null;
      }
    }

    function normalizeRecord(record) {
      return {
        id: record.id || record.ID || record.Id || "",
        createdAt: record.createdAt || record.CreatedAt || record.createdat || new Date().toISOString(),
        status: record.status || record.Status || "active",
        userId: record.userId || record.UserID || record.userid || "",
        mood: record.mood || record.Mood || "sunny",
        intensity: Number(record.intensity || record.Intensity || 0),
        diary: record.diary || record.Diary || ""
      };
    }

    // ========== 多人管理 ==========
    function loadUsers() {
      const raw = localStorage.getItem(USERS_KEY);
      if (raw) users = JSON.parse(raw);
      if (!users.length) {
        users = [
          { id: 'u1', name: '我', emoji: '🙂' },
          { id: 'u2', name: '伴侶', emoji: '❤️' }
        ];
        saveUsers();
      }
      if (!currentUserId || !users.find(u=>u.id===currentUserId)) currentUserId = users[0].id;
    }
    function saveUsers() { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
    function renderUserBar() {
      userListEl.innerHTML = users.map(u => `
        <div class="user-chip ${u.id===currentUserId?'active':''}" data-user="${u.id}">
          <span class="emoji">${u.emoji}</span> ${u.name}
        </div>`).join('');
      document.querySelectorAll('.user-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          currentUserId = chip.dataset.user;
          renderUserBar();
        });
      });
    }
    addUserBtn.addEventListener('click', () => {
      const name = prompt('輸入新使用者名稱：');
      if (!name) return;
      const emoji = prompt('選擇代表表情 (例如 😊)：', '😊') || '😊';
      users.push({ id: crypto.randomUUID(), name, emoji });
      saveUsers();
      currentUserId = users[users.length-1].id;
      renderUserBar();
    });

    // ========== localStorage 輔助 ==========
    function loadFromLocalStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw).filter(r => r && r.id) : [];
      } catch { return []; }
    }
    function persistToLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ========== 其他輔助 ==========
    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function formatTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function refreshView() {
      let filtered = currentFilter==='all' ? records : records.filter(r=>r.status===currentFilter);
      renderList(filtered);
    }
    function resetForm() {
      selectedMood = ''; selectedMoodInput.value = '';
      document.querySelectorAll('.mood-option').forEach(o=>o.classList.remove('selected'));
      intensityRange.value = 5; intensityDisplay.textContent = '5';
      diaryInput.value = ''; charCount.textContent = '0/100';
      editingIdInput.value = ''; editingId = null;
      validationError.textContent = '';
      document.querySelector('.submit-btn').textContent = '📡 記錄情緒';
    }
    function startEdit(id) {
      const rec = records.find(r=>r.id===id);
      if(!rec) return;
      selectedMood = rec.mood; selectedMoodInput.value = rec.mood;
      document.querySelectorAll('.mood-option').forEach(o=>{
        o.classList.toggle('selected', o.dataset.mood === rec.mood);
      });
      intensityRange.value = rec.intensity; intensityDisplay.textContent = rec.intensity;
      diaryInput.value = rec.diary; charCount.textContent = `${rec.diary.length}/100`;
      editingIdInput.value = rec.id; editingId = rec.id;
      document.querySelector('.submit-btn').textContent = '✏️ 更新紀錄';
      validationError.textContent = '';
      window.scrollTo({top:0,behavior:'smooth'});
    }

    // ========== 初始化 mood 選項 ==========
    function buildMoodOptions() {
      moodGrid.innerHTML = Object.entries(MOODS).map(([key,val])=>`
        <div class="mood-option" data-mood="${key}">
          <span class="emoji">${val.emoji}</span><span class="label">${val.label}</span>
        </div>`).join('');
      document.querySelectorAll('.mood-option').forEach(opt => {
        opt.addEventListener('click', () => {
          selectedMood = opt.dataset.mood;
          selectedMoodInput.value = selectedMood;
          document.querySelectorAll('.mood-option').forEach(o=>o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
    }

    // ========== 事件綁定 ==========
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!selectedMood) { validationError.textContent='請選擇天氣'; return; }
      const intensity = parseInt(intensityRange.value,10);
      if (isNaN(intensity) || intensity<1||intensity>10) { validationError.textContent='強度錯誤'; return; }
      const diary = diaryInput.value.trim();
      if (editingId) {
        updateRecord(editingId, { mood:selectedMood, intensity, diary });
      } else {
        const record = createRecord({ mood:selectedMood, intensity, diary });
        saveData(record);
      }
      resetForm();
      refreshView();
    });

    intensityRange.addEventListener('input', (e) => intensityDisplay.textContent = e.target.value);
    diaryInput.addEventListener('input', (e) => charCount.textContent = `${e.target.value.length}/100`);
    filterBtns.forEach(b => b.addEventListener('click', () => {
      filterBtns.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      currentFilter = b.dataset.filter;
      refreshView();
    }));
    sortBtn.addEventListener('click', () => {
      sortAsc = !sortAsc;
      sortBtn.textContent = sortAsc ? '🕒 最舊 ⇄ 最新' : '🕒 最新 ⇄ 最舊';
      refreshView();
    });

    // ========== 初始化 ==========
    function init() {
      loadUsers();
      buildMoodOptions();
      renderUserBar();
      // 先從 localStorage 載入（立即顯示），再從 Sheet 拉最新資料
      records = loadFromLocalStorage();
      refreshView();
      // 非同步從 Sheet 更新
      fetchRecordsFromSheet().then(sheetRecords => {
        if (sheetRecords !== null) {
          records = sheetRecords;
          cloudAvailable = true;
          syncStatusEl.textContent = '🟢 雲端已同步';
          persistToLocalStorage();
        } else {
          cloudAvailable = false;
          syncStatusEl.textContent = '🟠 無法連接雲端，使用離線資料';
        }
        refreshView();
      }).catch(() => {
        cloudAvailable = false;
        syncStatusEl.textContent = '🔴 雲端離線，使用本地資料';
      });
    }

    init();
    console.log('🌤️ 情緒氣象觀測站 · Google Sheet 同步版已就緒');
  })();
</script>
</body>
</html>
