<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>情緒氣象觀測站 · 全球情緒連結平台</title>
  <style>
    :root {
      --bg: #0f1a2e; --surface: #16253e; --card: #1e3550; --text: #e0e8f0; --text-soft: #8a9bb5;
      --accent: #ff7f50; --accent-glow: #ff9f70; --border: #2a4060; --radius-xl: 24px;
      --radius-lg: 18px; --radius-md: 12px; --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --shadow-glow: 0 0 24px rgba(255,127,80,0.25); --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang TC','Noto Sans TC','SF Pro Text',system-ui,sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
      display: flex; justify-content: center; align-items: flex-start; padding: 16px;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(255,127,80,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 100%, rgba(116,192,252,0.06) 0%, transparent 50%);
    }
    .app-container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .header { text-align: center; padding: 20px 0 8px; }
    .header-icon { font-size: 3.2rem; display: block; margin-bottom: 4px; }
    .header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.03em; }
    .subtitle { color: var(--text-soft); font-size: 0.85rem; margin-top: 2px; }
    .user-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    .user-badge {
      background: var(--accent); color: #fff; padding: 6px 16px; border-radius: 20px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: var(--transition);
    }
    .user-badge:hover { box-shadow: var(--shadow-glow); }
    .sync-status { font-size: 0.7rem; color: var(--text-soft); margin-top: 4px; min-height: 18px; }
    .tab-nav {
      display: flex; gap: 4px; background: var(--surface); border-radius: 40px; padding: 5px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 12px 10px; border: none; background: transparent; color: var(--text-soft);
      border-radius: 32px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
      transition: var(--transition); white-space: nowrap; letter-spacing: 0.02em;
    }
    .tab-btn.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-glow); }
    .tab-content { display: none; flex-direction: column; gap: 18px; }
    .tab-content.active { display: flex; }
    .section-card {
      background: var(--surface); border-radius: var(--radius-xl); padding: 22px 24px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .section-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em;
      font-weight: 600; color: var(--text-soft); margin-bottom: 10px; display: block;
    }
    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; text-align: center; }
    .mood-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .mood-option {
      flex: 1 1 60px; min-width: 60px; background: var(--card); border: 2px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 4px 10px; text-align: center; cursor: pointer;
      transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .mood-option:hover { border-color: #5a7a9a; transform: translateY(-2px); }
    .mood-option.selected { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,127,80,0.2); transform: translateY(-2px); }
    .mood-option .emoji { font-size: 1.8rem; }
    .mood-option .label { font-size: 0.78rem; color: var(--text-soft); }
    .mood-option.selected .label { color: var(--accent-glow); font-weight: 700; }
    .intensity-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    input[type="range"] {
      flex: 1; height: 6px; -webkit-appearance: none;
      background: linear-gradient(to right, #3a6080, var(--accent), #ff4444); border-radius: 4px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px; background: #fff;
      border: 3px solid var(--accent); border-radius: 50%; box-shadow: 0 4px 14px rgba(0,0,0,0.3); cursor: pointer;
    }
    .intensity-badge { font-weight: 700; font-size: 1.1rem; min-width: 40px; text-align: center; }
    textarea {
      width: 100%; border: 2px solid var(--border); border-radius: var(--radius-md); padding: 12px;
      font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 70px;
      background: var(--card); color: var(--text); transition: var(--transition);
    }
    textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 14px rgba(255,127,80,0.1); }
    .char-count { text-align: right; font-size: 0.65rem; color: var(--text-soft); }
    .btn {
      padding: 13px; border: none; border-radius: 32px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: var(--transition); letter-spacing: 0.03em; margin-top: 10px;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 18px rgba(255,127,80,0.3); width: 100%; }
    .btn-primary:hover { background: #ff8f60; transform: translateY(-1px); }
    .btn-small { padding: 8px 18px; font-size: 0.8rem; width: auto; display: inline-block; }
    .btn-secondary { background: transparent; border: 2px solid var(--border); color: var(--text); }
    .validation-error { color: #ff6b6b; font-size: 0.75rem; margin-top: 6px; }
    select {
      width: 100%; padding: 10px; border-radius: 12px; background: var(--card); color: var(--text);
      border: 2px solid var(--border); margin-bottom: 10px; font-family: inherit; font-size: 0.9rem;
    }
    .toolbar {
      display: flex; gap: 6px; background: var(--surface); padding: 5px; border-radius: 32px;
      border: 1px solid var(--border); flex-wrap: wrap;
    }
    .filter-btn, .sort-btn, .mode-btn {
      padding: 8px 16px; border: none; background: transparent; color: var(--text-soft);
      border-radius: 24px; font-weight: 500; cursor: pointer; transition: var(--transition); font-size: 0.8rem;
    }
    .filter-btn.active, .mode-btn.active { background: var(--accent); color: #fff; }
    .sort-btn { margin-left: auto; background: #2a4060; }
    .records-list { display: flex; flex-direction: column; gap: 12px; }
    .record-card {
      background: var(--card); border-radius: var(--radius-lg); padding: 16px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2); border: 1px solid var(--border);
      display: flex; gap: 14px; align-items: center; transition: var(--transition);
    }
    .record-card.is-done { opacity: 0.55; }
    .mood-icon { font-size: 2.2rem; width: 48px; text-align: center; flex-shrink: 0; }
    .record-content { flex: 1; min-width: 0; }
    .record-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
    .record-diary { font-size: 0.88rem; color: #c8d8e8; word-break: break-word; }
    .record-time { font-size: 0.68rem; color: #6a8090; margin-top: 2px; }
    .record-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .icon-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-soft);
      font-size: 1rem; cursor: pointer; padding: 6px 10px; border-radius: 20px; transition: var(--transition);
    }
    .icon-btn:hover { background: rgba(255,127,80,0.12); border-color: var(--accent); color: #fff; }
    .empty-message { text-align: center; padding: 40px; color: var(--text-soft); }
    .calendar { width: 100%; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .calendar-header button { background: var(--card); border: 1px solid var(--border); color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar-day-name { font-size: 0.7rem; color: var(--text-soft); padding: 6px 0; }
    .calendar-day {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 12px; cursor: pointer; transition: var(--transition); font-size: 0.85rem;
      background: var(--card); border: 1px solid transparent; position: relative;
    }
    .calendar-day:hover { border-color: var(--accent); }
    .calendar-day.today { border-color: var(--accent); box-shadow: 0 0 12px rgba(255,127,80,0.2); }
    .calendar-day .day-num { font-size: 0.7rem; color: var(--text-soft); position: absolute; top: 4px; left: 6px; }
    .calendar-day .day-emoji { font-size: 1.4rem; }
    .calendar-day.empty { background: transparent; cursor: default; }
    .bottle-card {
      background: linear-gradient(135deg, #1a3a4a, #0d2838); border-radius: 60px 60px 30px 30px;
      padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); border: 2px solid #3a6070;
      text-align: center; position: relative; max-width: 360px; margin: 0 auto; width: 100%;
    }
    .bottle-card .bottle-neck {
      width: 50px; height: 22px; background: #3a6070; border-radius: 10px 10px 0 0; margin: -10px auto 10px;
    }
    .bottle-card .bottle-emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; }
    .bottle-card .bottle-mood { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .bottle-card .bottle-diary { font-size: 0.95rem; color: #c8d8e8; margin-bottom: 10px; font-style: italic; }
    .bottle-card .bottle-region { font-size: 0.7rem; color: #6a8090; }
    .cheer-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .cheer-btn {
      background: rgba(255,255,255,0.06); border: 2px solid var(--border); color: #fff;
      font-size: 1rem; padding: 10px 16px; border-radius: 28px; cursor: pointer; transition: var(--transition);
    }
    .cheer-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-glow); transform: scale(1.05); }
    .cheer-btn.sent { background: var(--accent); border-color: var(--accent); animation: pulse 0.6s ease; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
    .message-board { margin-top: 14px; text-align: left; max-width: 360px; margin-left: auto; margin-right: auto; }
    .message-board .msg-item {
      background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; font-size: 0.8rem;
    }
    .message-board .msg-name { font-weight: 600; color: var(--accent-glow); margin-bottom: 2px; }
    .message-board .msg-text { color: #c8d8e8; }
    .message-board .msg-time { font-size: 0.6rem; color: #6a8090; margin-top: 2px; }
    .message-input-row { display: flex; gap: 8px; margin-top: 8px; }
    .message-input-row input {
      flex: 1; padding: 10px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: #fff;
    }
    .world-map { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .continent-card {
      background: var(--card); border-radius: var(--radius-lg); padding: 16px;
      border: 1px solid var(--border); cursor: pointer; transition: var(--transition);
      display: flex; flex-direction: column; gap: 8px;
    }
    .continent-card:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,127,80,0.15); }
    .continent-header { display: flex; align-items: center; gap: 8px; }
    .continent-flag { font-size: 1.8rem; }
    .continent-name { font-weight: 700; font-size: 0.9rem; }
    .continent-count { font-size: 0.65rem; color: var(--text-soft); margin-left: auto; }
    .bar-chart { display: flex; flex-direction: column; gap: 3px; }
    .bar-row { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; }
    .bar-emoji { width: 22px; text-align: center; }
    .bar-track { flex: 1; height: 10px; background: #1a2a40; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease; }
    .bar-fill.sunny { background: #f5a623; } .bar-fill.cloudy { background: #8e8e93; }
    .bar-fill.rainy { background: #4a90d9; } .bar-fill.thunder { background: #7b5ea7; }
    .bar-fill.rainbow { background: linear-gradient(90deg, #ff6b6b, #ffa94d, #ffd43b, #69db7c, #74c0fc); }
    .bar-pct { width: 32px; text-align: right; color: var(--text-soft); }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--surface); border-radius: var(--radius-xl); padding: 24px;
      max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid var(--border);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-close {
      background: none; border: none; color: var(--text-soft); font-size: 1.5rem; cursor: pointer;
      padding: 4px 8px; border-radius: 8px;
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .modal-bottle {
      background: var(--card); border-radius: var(--radius-md); padding: 12px 14px;
      border: 1px solid var(--border); margin-bottom: 8px;
    }
    .world-loading { text-align: center; padding: 20px; color: var(--text-soft); }
    .world-error { text-align: center; padding: 20px; color: #ff6b6b; }
    @media (max-width: 500px) {
      .tab-btn { font-size: 0.75rem; padding: 10px 6px; }
      .record-card { flex-wrap: wrap; }
      .world-map { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="header">
    <span class="header-icon">🌤️</span>
    <h1>情緒氣象觀測站</h1>
    <p class="subtitle">把你的心情投向世界，撈起陌生人的溫暖</p>
    <div class="user-row"><span class="user-badge" id="userBadge">🙂 匿名旅人</span></div>
    <p class="sync-status" id="syncStatus">🟡 正在連接雲端...</p>
  </header>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="tab-diary">📔 我的日記</button>
    <button class="tab-btn" data-tab="tab-bottle">🫧 漂流瓶</button>
    <button class="tab-btn" data-tab="tab-world">🌍 世界情緒</button>
  </nav>

  <div class="tab-content active" id="tab-diary">
    <div class="toolbar" id="diaryToolbar">
      <button class="mode-btn active" data-mode="calendar">📅 月曆</button>
      <button class="mode-btn" data-mode="list">📋 列表</button>
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">活躍中</button>
      <button class="filter-btn" data-filter="done">已回顧</button>
      <button class="sort-btn" id="diarySortBtn">🕒 最新 ⇄ 最舊</button>
    </div>
    <div id="diaryCalendarView"></div>
    <div id="diaryListView" class="records-list" style="display:none;"></div>
  </div>

  <div class="tab-content" id="tab-bottle">
    <div class="section-card" style="text-align:center;">
      <span class="section-title">🫧 把你的心情裝進瓶子，投向大海</span>
      <form id="bottleForm" autocomplete="off">
        <span class="section-label">🌡️ 情緒天氣</span>
        <div class="mood-grid" id="bottleMoodGrid"></div>
        <input type="hidden" id="bottleSelectedMood" value="">
        <span class="section-label">💪 強度</span>
        <div class="intensity-row">
          <input type="range" id="bottleIntensity" min="1" max="10" value="5" step="1">
          <span class="intensity-badge" id="bottleIntensityDisplay">5</span>
        </div>
        <span class="section-label">📝 瓶中信</span>
        <textarea id="bottleDiary" maxlength="100" placeholder="寫下想對世界說的話..."></textarea>
        <div class="char-count" id="bottleCharCount">0 / 100</div>
        <span class="section-label">🌍 你的地區</span>
        <select id="bottleRegion">
          <option value="asia">亞洲</option><option value="europe">歐洲</option><option value="north_america">北美洲</option>
          <option value="south_america">南美洲</option><option value="africa">非洲</option><option value="oceania">大洋洲</option>
        </select>
        <div class="validation-error" id="bottleError"></div>
        <button type="submit" class="btn btn-primary">🫧 投向大海</button>
      </form>
    </div>
    <div class="section-card" style="text-align:center;">
      <span class="section-title">🐚 撈取一個陌生人的瓶子</span>
      <div id="bottleDisplay"><p style="color:var(--text-soft);">點擊下方按鈕，隨機撈取一個來自世界的情緒瓶子</p></div>
      <button class="btn btn-primary" id="fetchBottleBtn">🎣 撈取瓶子</button>
      <p style="text-align:center;color:var(--text-soft);font-size:0.7rem;margin-top:8px;" id="seaStatus"></p>
    </div>
  </div>

  <div class="tab-content" id="tab-world">
    <div class="section-card">
      <span class="section-title">🌍 世界情緒氣象</span>
      <p style="text-align:center;color:var(--text-soft);font-size:0.8rem;margin-bottom:14px;">點擊各大洲查看該地區的情緒瓶子</p>
      <div id="worldLoading" class="world-loading">🟡 正在從雲端載入世界情緒資料...</div>
      <div class="world-map" id="worldMap" style="display:none;"></div>
      <div id="worldError" class="world-error" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
(() => {
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznFeFO0KxYIlMPH2xtHpU3YmT98CpSVydH21XncEOFx9FoO4qyU3oXrrw2JmlQXGfh5g/exec";
  const STORAGE_KEY = 'records';
  const USER_KEY = 'moodUser';
  const MOODS = {
    sunny:{label:'晴',emoji:'☀️'},cloudy:{label:'陰',emoji:'☁️'},rainy:{label:'雨',emoji:'🌧️'},
    thunder:{label:'雷',emoji:'⛈️'},rainbow:{label:'彩虹',emoji:'🌈'}
  };
  const VALID_MOODS=Object.keys(MOODS);
  const REGION_LABELS={asia:'亞洲',europe:'歐洲',north_america:'北美洲',south_america:'南美洲',africa:'非洲',oceania:'大洋洲'};
  const REGION_EMOJIS={asia:'🌏',europe:'🌍',north_america:'🌎',south_america:'🌎',africa:'🌍',oceania:'🏝️'};
  const CONTINENTS=['asia','europe','north_america','south_america','africa','oceania'];

  let records=[],currentUser=null,currentTab='tab-diary',diaryMode='calendar',diaryFilter='all',diarySortAsc=false;
  let diarySelectedMood='',diaryEditingId=null,diaryEditingDate='',bottleSelectedMood='',cloudAvailable=false,worldData=[];
  let calendarYear,calendarMonth,currentBottleId=null;

  const syncStatusEl=document.getElementById('syncStatus'),userBadge=document.getElementById('userBadge');
  const tabNav=document.getElementById('tabNav'),tabContents=document.querySelectorAll('.tab-content');
  const diaryCalendarView=document.getElementById('diaryCalendarView'),diaryListView=document.getElementById('diaryListView');
  const diaryToolbar=document.getElementById('diaryToolbar'),diarySortBtn=document.getElementById('diarySortBtn');
  const bottleForm=document.getElementById('bottleForm'),bottleMoodGrid=document.getElementById('bottleMoodGrid');
  const bottleSelectedMoodInput=document.getElementById('bottleSelectedMood');
  const bottleIntensity=document.getElementById('bottleIntensity'),bottleIntensityDisplay=document.getElementById('bottleIntensityDisplay');
  const bottleDiary=document.getElementById('bottleDiary'),bottleCharCount=document.getElementById('bottleCharCount');
  const bottleRegion=document.getElementById('bottleRegion'),bottleError=document.getElementById('bottleError');
  const bottleDisplay=document.getElementById('bottleDisplay'),fetchBottleBtn=document.getElementById('fetchBottleBtn');
  const seaStatus=document.getElementById('seaStatus');
  const worldMap=document.getElementById('worldMap'),worldLoading=document.getElementById('worldLoading'),worldError=document.getElementById('worldError');
  const modalOverlay=document.getElementById('modalOverlay'),modalContent=document.getElementById('modalContent');

  function createRecord(data){
    if(!data.mood||!VALID_MOODS.includes(data.mood))throw new Error('請選擇情緒天氣');
    if(typeof data.intensity!=='number'||data.intensity<1||data.intensity>10)throw new Error('強度1-10');
    return{id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36),createdAt:data.createdAt||new Date().toISOString(),status:data.status||'active',userId:currentUser.id,mood:data.mood,intensity:data.intensity,diary:(data.diary||'').trim().slice(0,100),isPublic:data.isPublic!==undefined?data.isPublic:false,region:data.region||'',cheers:data.cheers||'[]',messages:data.messages||'[]'};
  }
  function saveData(record){records.push(record);persistLocal();syncToSheet({action:"create",record});updateSeaStatus();if(currentTab==='tab-world')loadWorldData();}
  function updateRecord(id,changes){const idx=records.findIndex(r=>r.id===id);if(idx===-1)return false;records[idx]={...records[idx],...changes};persistLocal();syncToSheet({action:"update",id,changes});if(currentTab==='tab-world')loadWorldData();return true;}
  function deleteRecord(id){records=records.filter(r=>r.id!==id);persistLocal();syncToSheet({action:"delete",id});updateSeaStatus();if(currentTab==='tab-world')loadWorldData();}
  function loadData(){const local=loadFromLocal();records=local;updateSeaStatus();fetchFromSheet().then(sr=>{if(sr!==null){records=sr;cloudAvailable=true;syncStatusEl.textContent='🟢 雲端已同步';persistLocal();}else{cloudAvailable=false;syncStatusEl.textContent='🟠 無法連接雲端，使用離線資料';}refreshAll();}).catch(()=>{cloudAvailable=false;syncStatusEl.textContent='🔴 雲端離線，使用本地資料';refreshAll();});}
  function syncToSheet(payload){if(!APPS_SCRIPT_URL)return;fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).then(r=>r.json()).then(d=>{if(!d.ok)console.warn('Sheet error:',d.error);}).catch(e=>console.warn('Sheet unreachable:',e.message));}
  async function fetchFromSheet(){if(!APPS_SCRIPT_URL)return null;try{const res=await fetch(APPS_SCRIPT_URL);const data=await res.json();if(data.ok&&Array.isArray(data.records))return data.records.map(normalizeRecord);return null;}catch{return null;}}
  function normalizeRecord(r){
    let ip=r.isPublic;if(ip===undefined)ip=r.IsPublic;let ipb=false;if(typeof ip==='boolean')ipb=ip;else if(typeof ip==='string')ipb=ip.toUpperCase()==='TRUE';else if(typeof ip==='number')ipb=ip===1;
    return{id:r.id||r.ID||r.Id||'',createdAt:r.createdAt||r.CreatedAt||r.createdat||new Date().toISOString(),status:r.status||r.Status||'active',userId:r.userId||r.UserID||r.UserId||r.userid||'',mood:r.mood||r.Mood||'sunny',intensity:Number(r.intensity||r.Intensity||0),diary:r.diary||r.Diary||'',isPublic:ipb,region:r.region||r.Region||'',cheers:r.cheers||r.Cheers||'[]',messages:r.messages||r.Messages||'[]'};
  }
  function loadFromLocal(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw).filter(r=>r&&r.id):[];}catch{return[];}}
  function persistLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}
  function loadUser(){const raw=localStorage.getItem(USER_KEY);if(raw){currentUser=JSON.parse(raw);return;}currentUser={id:crypto.randomUUID(),name:'匿名旅人',emoji:'🙂'};saveUser();}
  function saveUser(){localStorage.setItem(USER_KEY,JSON.stringify(currentUser));}
  userBadge.addEventListener('click',()=>{const name=prompt('輸入你的匿名暱稱：',currentUser.name)||currentUser.name;const emoji=prompt('選擇代表表情：',currentUser.emoji)||currentUser.emoji;currentUser={...currentUser,name,emoji};saveUser();userBadge.textContent=`${currentUser.emoji} ${currentUser.name}`;});
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function formatTime(iso){const d=new Date(iso);return isNaN(d)?iso:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
  function formatDate(iso){const d=new Date(iso);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function buildMoodGrid(container,onSelect){container.innerHTML=Object.entries(MOODS).map(([k,v])=>`<div class="mood-option" data-mood="${k}"><span class="emoji">${v.emoji}</span><span class="label">${v.label}</span></div>`).join('');container.querySelectorAll('.mood-option').forEach(opt=>{opt.addEventListener('click',()=>{container.querySelectorAll('.mood-option').forEach(o=>o.classList.remove('selected'));opt.classList.add('selected');onSelect(opt.dataset.mood);});});}
  function updateSeaStatus(){const total=records.filter(r=>r.isPublic).length;const others=records.filter(r=>r.isPublic&&r.userId!==currentUser.id).length;seaStatus.textContent=`🌊 大海中目前有 ${total} 個瓶子（其中 ${others} 個來自其他人）`;}

  // 月曆
  function getMyDiaries(){return records.filter(r=>r.userId===currentUser.id&&!r.isPublic);}
  function getDiaryByDate(dateStr){return getMyDiaries().find(r=>formatDate(r.createdAt)===dateStr);}
  function renderCalendar(){
    const now=new Date();if(!calendarYear){calendarYear=now.getFullYear();calendarMonth=now.getMonth()+1;}
    const firstDay=new Date(calendarYear,calendarMonth-1,1).getDay(),daysInMonth=new Date(calendarYear,calendarMonth,0).getDate(),todayStr=formatDate(now.toISOString());
    let html=`<div class="calendar"><div class="calendar-header"><button id="calPrev">◀</button><span style="font-weight:700;">${calendarYear} 年 ${calendarMonth} 月</span><button id="calNext">▶</button></div><div class="calendar-grid">`;
    ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="calendar-day-name">${d}</div>`);
    for(let i=0;i<firstDay;i++)html+='<div class="calendar-day empty"></div>';
    for(let d=1;d<=daysInMonth;d++){const ds=`${calendarYear}-${String(calendarMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const diary=getDiaryByDate(ds);const emoji=diary?MOODS[diary.mood]?.emoji||'❓':'';html+=`<div class="calendar-day${ds===todayStr?' today':''}" data-date="${ds}"><span class="day-num">${d}</span><span class="day-emoji">${emoji}</span></div>`;}
    html+='</div></div>';diaryCalendarView.innerHTML=html;
    document.getElementById('calPrev').addEventListener('click',()=>{if(calendarMonth===1){calendarYear--;calendarMonth=12;}else calendarMonth--;renderCalendar();});
    document.getElementById('calNext').addEventListener('click',()=>{if(calendarMonth===12){calendarYear++;calendarMonth=1;}else calendarMonth++;renderCalendar();});
    diaryCalendarView.querySelectorAll('.calendar-day:not(.empty)').forEach(day=>{day.addEventListener('click',()=>openDayModal(day.dataset.date));});
  }
  function openDayModal(dateStr){
    const diary=getDiaryByDate(dateStr);
    if(diary){const mood=MOODS[diary.mood]||{};modalContent.innerHTML=`<div class="modal-header"><span>📅 ${dateStr}</span><button class="modal-close" id="modalClose">✕</button></div><div style="text-align:center;font-size:3rem;">${mood.emoji}</div><p style="text-align:center;font-weight:700;">${mood.label} · ${diary.intensity}/10</p><p style="text-align:center;color:var(--text-soft);">${escapeHtml(diary.diary)||'⋯'}</p><div style="display:flex;gap:8px;justify-content:center;margin-top:12px;"><button class="btn btn-primary btn-small edit-day-btn">✏️ 編輯</button><button class="btn btn-secondary btn-small delete-day-btn">🗑️ 刪除</button></div>`;modalOverlay.classList.add('active');document.getElementById('modalClose').addEventListener('click',()=>modalOverlay.classList.remove('active'));modalContent.querySelector('.edit-day-btn').addEventListener('click',()=>{modalOverlay.classList.remove('active');openEditForm(dateStr);});modalContent.querySelector('.delete-day-btn').addEventListener('click',()=>{if(confirm('刪除這天的心情？')){deleteRecord(diary.id);refreshAll();modalOverlay.classList.remove('active');}});}
    else{openEditForm(dateStr);}
  }
  function openEditForm(dateStr){diaryEditingDate=dateStr;modalContent.innerHTML=`<div class="modal-header"><span>📅 ${dateStr} 記錄心情</span><button class="modal-close" id="modalClose">✕</button></div><span class="section-label">🌡️ 情緒天氣</span><div class="mood-grid" id="modalMoodGrid"></div><input type="hidden" id="modalSelectedMood" value=""><span class="section-label">💪 強度</span><div class="intensity-row"><input type="range" id="modalIntensity" min="1" max="10" value="5" step="1"><span class="intensity-badge" id="modalIntensityDisplay">5</span></div><span class="section-label">📝 一句話日記</span><textarea id="modalDiary" maxlength="100" placeholder="寫下此刻的感受..."></textarea><div class="validation-error" id="modalError"></div><button class="btn btn-primary" id="modalSubmit">📡 記錄</button>`;modalOverlay.classList.add('active');let modalMood='';buildMoodGrid(document.getElementById('modalMoodGrid'),m=>{modalMood=m;document.getElementById('modalSelectedMood').value=m;});document.getElementById('modalIntensity').addEventListener('input',e=>document.getElementById('modalIntensityDisplay').textContent=e.target.value);document.getElementById('modalClose').addEventListener('click',()=>modalOverlay.classList.remove('active'));document.getElementById('modalSubmit').addEventListener('click',()=>{if(!modalMood){document.getElementById('modalError').textContent='請選擇天氣';return;}const intensity=parseInt(document.getElementById('modalIntensity').value);if(isNaN(intensity)||intensity<1||intensity>10){document.getElementById('modalError').textContent='強度錯誤';return;}const diaryText=document.getElementById('modalDiary').value.trim();const createdAt=new Date(dateStr+'T12:00:00').toISOString();saveData(createRecord({mood:modalMood,intensity,diary:diaryText,status:'active',isPublic:false,createdAt}));modalOverlay.classList.remove('active');refreshAll();});}

  function renderDiaryList(filtered){const sorted=[...filtered].sort((a,b)=>diarySortAsc?new Date(a.createdAt)-new Date(b.createdAt):new Date(b.createdAt)-new Date(a.createdAt));if(!sorted.length){diaryListView.innerHTML='<div class="empty-message">📭 尚無私人日記</div>';return;}diaryListView.innerHTML=sorted.map(r=>{const mood=MOODS[r.mood]||{};return`<div class="record-card ${r.status==='done'?'is-done':''}"><div class="mood-icon">${mood.emoji||'❓'}</div><div class="record-content"><div class="record-meta"><span>${mood.label} · ${r.intensity}/10</span></div><div class="record-diary">${escapeHtml(r.diary)||'⋯'}</div><div class="record-time">${formatTime(r.createdAt)}</div></div><div class="record-actions"><button class="icon-btn toggle-done" data-id="${r.id}">${r.status==='done'?'↩️':'✅'}</button><button class="icon-btn edit-list-diary" data-id="${r.id}">✏️</button><button class="icon-btn delete-diary" data-id="${r.id}">🗑️</button></div></div>`;}).join('');bindDiaryButtons();}
  function bindDiaryButtons(){diaryListView.querySelectorAll('.toggle-done').forEach(b=>b.addEventListener('click',e=>{const id=e.currentTarget.dataset.id;const r=records.find(x=>x.id===id);if(r)updateRecord(id,{status:r.status==='active'?'done':'active'});refreshDiary();}));diaryListView.querySelectorAll('.edit-list-diary').forEach(b=>b.addEventListener('click',e=>{const r=records.find(x=>x.id===e.currentTarget.dataset.id);if(r)openEditForm(formatDate(r.createdAt));}));diaryListView.querySelectorAll('.delete-diary').forEach(b=>b.addEventListener('click',e=>{if(confirm('確定刪除？')){deleteRecord(e.currentTarget.dataset.id);refreshDiary();}}));}
  function refreshDiary(){if(diaryMode==='calendar')renderCalendar();else{const myDiaries=getMyDiaries();const filtered=diaryFilter==='all'?myDiaries:myDiaries.filter(r=>r.status===diaryFilter);renderDiaryList(filtered);}}

  // 漂流瓶 + 公開留言板
  function renderBottleDisplay(record){
    if(!record){bottleDisplay.innerHTML='<p style="color:var(--text-soft);">點擊下方按鈕，隨機撈取一個來自世界的情緒瓶子</p>';currentBottleId=null;return;}
    currentBottleId=record.id;
    const mood=MOODS[record.mood]||{},regionName=REGION_LABELS[record.region]||'未知';
    let cheersArr=[];try{cheersArr=JSON.parse(record.cheers||'[]');}catch{}
    let messagesArr=[];try{messagesArr=JSON.parse(record.messages||'[]');}catch{}
    const msgsHTML=messagesArr.map(m=>`<div class="msg-item"><div class="msg-name">${escapeHtml(m.name)}</div><div class="msg-text">${escapeHtml(m.msg)}</div><div class="msg-time">${formatTime(m.time)}</div></div>`).join('');
    bottleDisplay.innerHTML=`
      <div class="bottle-card">
        <div class="bottle-neck"></div>
        <span class="bottle-emoji">${mood.emoji}</span>
        <div class="bottle-mood">${mood.label} · ${record.intensity}/10</div>
        <div class="bottle-diary">"${escapeHtml(record.diary)||'⋯'}"</div>
        <div class="bottle-region">📍 ${regionName} · ${formatTime(record.createdAt)}</div>
        <div style="margin-top:8px;font-size:1.1rem;">${cheersArr.length?cheersArr.join(' '):''}</div>
        <div class="cheer-buttons">
          <button class="cheer-btn" data-cheer="🫶">🫶</button>
          <button class="cheer-btn" data-cheer="🌈">🌈</button>
          <button class="cheer-btn" data-cheer="🔥">🔥</button>
        </div>
      </div>
      <div class="message-board">
        <div style="font-weight:700;margin-bottom:6px;color:var(--text-soft);">💬 公開留言 (${messagesArr.length})</div>
        ${msgsHTML||'<div style="color:var(--text-soft);font-size:0.7rem;">尚無留言，成為第一個留言的人吧！</div>'}
        <div class="message-input-row">
          <input id="msgInput" placeholder="寫下你的回應..." maxlength="200">
          <button class="btn btn-primary btn-small" id="msgSend">發送</button>
        </div>
      </div>`;
    // cheer 按鈕
    bottleDisplay.querySelectorAll('.cheer-btn').forEach(btn=>{btn.addEventListener('click',function(){let arr=[];try{arr=JSON.parse(record.cheers||'[]');}catch{}arr.push(this.dataset.cheer);updateRecord(record.id,{cheers:JSON.stringify(arr)});this.classList.add('sent');setTimeout(()=>this.classList.remove('sent'),600);record.cheers=JSON.stringify(arr);renderBottleDisplay(record);});});
    // 留言發送
    document.getElementById('msgSend').addEventListener('click',()=>{const msg=document.getElementById('msgInput').value.trim();if(!msg)return;messagesArr.push({name:currentUser.name,msg,time:new Date().toISOString()});updateRecord(record.id,{messages:JSON.stringify(messagesArr)});record.messages=JSON.stringify(messagesArr);renderBottleDisplay(record);});
  }

  function resetBottleForm(){bottleSelectedMood='';bottleSelectedMoodInput.value='';document.querySelectorAll('#bottleMoodGrid .mood-option').forEach(o=>o.classList.remove('selected'));bottleIntensity.value=5;bottleIntensityDisplay.textContent='5';bottleDiary.value='';bottleCharCount.textContent='0/100';bottleError.textContent='';}

  // 世界地圖
  async function loadWorldData(){worldLoading.style.display='block';worldMap.style.display='none';worldError.style.display='none';try{const sr=await fetchFromSheet();worldData=sr?sr.filter(r=>r.isPublic):records.filter(r=>r.isPublic);if(!worldData.length){worldLoading.style.display='none';worldError.style.display='block';worldError.textContent='🌊 目前還沒有公開的情緒瓶子，去投遞一個吧！';return;}renderWorldMap(worldData);worldLoading.style.display='none';worldMap.style.display='grid';}catch{worldData=records.filter(r=>r.isPublic);if(!worldData.length){worldLoading.style.display='none';worldError.style.display='block';worldError.textContent='⚠️ 無法載入世界資料';return;}renderWorldMap(worldData);worldLoading.style.display='none';worldMap.style.display='grid';}}
  function renderWorldMap(data){worldMap.innerHTML=CONTINENTS.map(c=>{const rr=data.filter(r=>r.region===c);const t=rr.length;const mc={};rr.forEach(r=>{mc[r.mood]=(mc[r.mood]||0)+1;});const sm=Object.entries(mc).sort((a,b)=>b[1]-a[1]);const bar=t>0?sm.map(([m,ct])=>{const p=Math.round((ct/t)*100);const mi=MOODS[m]||{emoji:'❓'};return`<div class="bar-row"><span class="bar-emoji">${mi.emoji}</span><div class="bar-track"><div class="bar-fill ${m}" style="width:${p}%;"></div></div><span class="bar-pct">${p}%</span></div>`;}).join(''):'<div class="bar-row"><span style="color:var(--text-soft);font-size:0.65rem;">尚無瓶子</span></div>';return`<div class="continent-card" data-continent="${c}"><div class="continent-header"><span class="continent-flag">${REGION_EMOJIS[c]}</span><span class="continent-name">${REGION_LABELS[c]}</span><span class="continent-count">${t} 瓶</span></div><div class="bar-chart">${bar}</div></div>`;}).join('');worldMap.querySelectorAll('.continent-card').forEach(card=>card.addEventListener('click',()=>showContinentDetail(card.dataset.continent)));}
  function showContinentDetail(continent){const rr=worldData.filter(r=>r.region===continent);const rn=REGION_LABELS[continent]||continent;const re=REGION_EMOJIS[continent]||'🌍';modalContent.innerHTML=rr.length?`<div class="modal-header"><span>${re} ${rn} · ${rr.length} 個瓶子</span><button class="modal-close" id="modalClose">✕</button></div>${[...rr].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(r=>{const mood=MOODS[r.mood]||{};let ca=[];try{ca=JSON.parse(r.cheers||'[]');}catch{}return`<div class="modal-bottle"><div class="bottle-header"><span>${mood.emoji}</span><span>${mood.label} · ${r.intensity}/10</span>${ca.length?`<span style="font-size:0.65rem;color:var(--accent-glow);">${ca.join(' ')} ×${ca.length}</span>`:''}</div><div class="bottle-diary">${escapeHtml(r.diary)||'⋯'}</div><div class="bottle-time">${formatTime(r.createdAt)}</div></div>`;}).join('')}`:`<div class="modal-header"><span>${re} ${rn}</span><button class="modal-close" id="modalClose">✕</button></div><p style="color:var(--text-soft);text-align:center;">這個地區還沒有任何情緒瓶子 🫧</p>`;modalOverlay.classList.add('active');document.getElementById('modalClose').addEventListener('click',()=>modalOverlay.classList.remove('active'));}
  modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)modalOverlay.classList.remove('active');});

  // Tab 切換
  tabNav.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',()=>{tabNav.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentTab=btn.dataset.tab;tabContents.forEach(tc=>tc.classList.remove('active'));document.getElementById(currentTab).classList.add('active');if(currentTab==='tab-world')loadWorldData();if(currentTab==='tab-bottle')updateSeaStatus();});});

  // 事件
  diaryToolbar.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',function(){diaryToolbar.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');diaryMode=this.dataset.mode;diaryCalendarView.style.display=diaryMode==='calendar'?'block':'none';diaryListView.style.display=diaryMode==='list'?'flex':'none';diarySortBtn.style.display=diaryMode==='list'?'inline-block':'none';refreshDiary();}));
  diaryToolbar.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',function(){diaryToolbar.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');diaryFilter=this.dataset.filter;refreshDiary();}));
  diarySortBtn.addEventListener('click',()=>{diarySortAsc=!diarySortAsc;diarySortBtn.textContent=diarySortAsc?'🕒 最舊 ⇄ 最新':'🕒 最新 ⇄ 最舊';refreshDiary();});
  buildMoodGrid(bottleMoodGrid,m=>{bottleSelectedMood=m;bottleSelectedMoodInput.value=m;});
  bottleIntensity.addEventListener('input',e=>bottleIntensityDisplay.textContent=e.target.value);
  bottleDiary.addEventListener('input',e=>bottleCharCount.textContent=`${e.target.value.length}/100`);
  bottleForm.addEventListener('submit',e=>{e.preventDefault();if(!bottleSelectedMood){bottleError.textContent='請選擇天氣';return;}const intensity=parseInt(bottleIntensity.value);if(isNaN(intensity)||intensity<1||intensity>10){bottleError.textContent='強度錯誤';return;}saveData(createRecord({mood:bottleSelectedMood,intensity,diary:bottleDiary.value.trim(),status:'active',isPublic:true,region:bottleRegion.value}));resetBottleForm();bottleDisplay.innerHTML='<p style="color:#69db7c;">✅ 你的瓶子已投向大海！</p>';updateSeaStatus();refreshDiary();});
  fetchBottleBtn.addEventListener('click',async()=>{const sr=await fetchFromSheet();if(sr!==null){records=sr;persistLocal();updateSeaStatus();}const pr=records.filter(r=>r.isPublic&&r.userId!==currentUser.id);if(!pr.length){bottleDisplay.innerHTML=`<p style="color:var(--text-soft);">🌊 大海中還沒有其他人的瓶子<br><small>目前大海中有 ${records.filter(r=>r.isPublic).length} 個瓶子（其中 ${records.filter(r=>r.isPublic&&r.userId===currentUser.id).length} 個是你投的）</small></p>`;return;}renderBottleDisplay(pr[Math.floor(Math.random()*pr.length)]);});

  function refreshAll(){refreshDiary();updateSeaStatus();userBadge.textContent=`${currentUser.emoji} ${currentUser.name}`;}
  function init(){loadUser();const now=new Date();calendarYear=now.getFullYear();calendarMonth=now.getMonth()+1;buildMoodGrid(bottleMoodGrid,m=>{bottleSelectedMood=m;bottleSelectedMoodInput.value=m;});records=loadFromLocal();diaryCalendarView.style.display='block';diaryListView.style.display='none';refreshAll();fetchFromSheet().then(sr=>{if(sr!==null){records=sr;cloudAvailable=true;syncStatusEl.textContent='🟢 雲端已同步';persistLocal();}else{cloudAvailable=false;syncStatusEl.textContent='🟠 無法連接雲端，使用離線資料';}refreshAll();}).catch(()=>{cloudAvailable=false;syncStatusEl.textContent='🔴 雲端離線，使用本地資料';});setInterval(()=>{fetchFromSheet().then(sr=>{if(sr!==null){const old=JSON.stringify(records);records=sr;persistLocal();if(JSON.stringify(records)!==old){if(currentBottleId){const updated=records.find(r=>r.id===currentBottleId);if(updated)renderBottleDisplay(updated);}updateSeaStatus();syncStatusEl.textContent='🟢 雲端已同步';}}}).catch(()=>{});},8000);}
  init();
})();
</script>
</body>
</html>
